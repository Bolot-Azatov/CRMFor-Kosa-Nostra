spring:
  application:
    name: crm-kosa-nostra

  datasource:
    url: jdbc:h2:file:./database/kosa-nostra-db;AUTO_SERVER=TRUE;
    driver-class-name: org.h2.Driver
    username: Bolot Azatov
    password: qwerty

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/master.yml
    drop-first: true
    enabled: true

  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftlh
    charset: UTF-8
    settings:
      number_format: "0.##"

server:
  port: 8080