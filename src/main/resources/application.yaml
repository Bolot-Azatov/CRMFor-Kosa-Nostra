spring:
  application:
    name: crm-kosa-nostra

  datasource:
    url: jdbc:h2:file:./database/kosa-nostra-db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000;
    driver-class-name: org.h2.Driver
    username: Bolot Azatov
    password: qwerty
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    change-log: classpath:db/changelog/master.yml
#    drop-first: true
    enabled: true

  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftlh
    charset: UTF-8
    settings:
      number_format: "0.##"

server:
  port: 8080