spring:
  application:
    name: crm-kosa-nostra

  datasource:
    url: jdbc:h2:mem:kosa-nostra-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: Bolot Azatov
    password: qwerty

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/master.yml
    enabled: true

server:
  port: 8080