public.home.title=The Five Families of New York
public.home.subtitle=Commission of 1931 • Code of Omerta • Secret Empire of the Syndicate
public.home.commission.title=Establishment of the Commission (1931)
public.home.commission.p1=After the bloody Castellammarese War, Charles "Lucky" Luciano abolished the title of Capo di tutti i capi ("Boss of all bosses"), establishing a collective governing body — the Commission. New York was split equally between the Five Families: Gambino, Genovese, Lucchese, Bonanno, and Colombo.
public.home.commission.p2=This CRM platform represents the digital counterpart of the 1950s ledgers and diplomatic lines: from tracking waterfront tribute in Brooklyn to backroom peace treaties between clans.
public.home.commission.btn=Dispatches & Article Archive

public.home.omerta.title=The Code of Omerta
public.home.omerta.rule1=No one can introduce themselves directly to a friend. A third party must present you.
public.home.omerta.rule2=Never look at the wives of our friends. Family respect precedes temptation.
public.home.omerta.rule3=The Capo and Don always receive their 80% cut strictly on schedule.
public.home.omerta.rule4=One's word of honor is the only unbreakable contract. Betrayal is punished by oblivion.
